<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>우리집 일기장</title>
    <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css?v=1.7.0">
</head>

<body>
    <div id="ptr-indicator" class="ptr-indicator">
        <div class="ptr-spinner">
            <i class="fas fa-sync-alt"></i>
        </div>
    </div>
    <div class="container">
        <header>
            <div class="header-top">
                <a href="../index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>
                <h1 class="premium-title">우리집 일기장</h1>
                <div class="header-actions">
                    <button id="search-toggle" title="검색"><i class="fas fa-search"></i></button>
                    <button id="theme-toggle" title="테마 변경"><i class="fas fa-sun"></i></button>
                </div>
            </div>
        </header>

        <main class="app-main">
            <div class="search-bar" id="search-bar" style="display:none;">
                <div class="search-input-wrapper">
                    <i class="fas fa-search"></i>
                    <input type="text" id="diary-search" placeholder="일기 내용을 검색해보세요...">
                </div>
            </div>
            
            <section class="summary-card">
                <div class="intro-content">
                    <h2>오늘 우리 가족은<br>어떤 하루였나요?</h2>
                    <p>소중한 기억을 담아보세요.</p>
                </div>
                <i class="fas fa-feather-pointed intro-icon"></i>
            </section>

            <div class="filter-bar">
                <button class="filter-btn active" data-author="all">전체</button>
                <button class="filter-btn" data-author="아빠">아빠</button>
                <button class="filter-btn" data-author="엄마">엄마</button>
                <button class="filter-btn" data-author="교현">교현</button>
                <button class="filter-btn" data-author="교빈">교빈</button>
                <button class="filter-btn" data-author="교은">교은</button>
            </div>

            <div id="diary-list" class="diary-list"></div>
        </main>

        <!-- 하단 플로팅 버튼 (우리집 표준) -->
        <div class="add-btn-container">
            <button id="open-modal-btn" onclick="openWriteModal()"><i class="fas fa-pen-fancy"></i> 일기 쓰기</button>
        </div>

        <!-- 일기 쓰기 모달 (가계부 표준) -->
        <div id="write-modal" class="modal hidden">
            <div class="modal-content">
                <header class="modal-header-premium">
                    <h3 class="modal-title-premium">일기 쓰기</h3>
                    <button class="close-modal-btn" onclick="closeModal(document.getElementById('write-modal'))">
                        <i class="fas fa-times"></i>
                    </button>
                </header>

                <div class="modal-body-premium">
                    <div class="input-group-premium">
                        <label>작성자</label>
                        <div class="author-chips" id="author-select">
                            <div class="author-chip" data-value="아빠">아빠</div>
                            <div class="author-chip" data-value="엄마">엄마</div>
                            <div class="author-chip" data-value="교현">교현</div>
                            <div class="author-chip" data-value="교빈">교빈</div>
                            <div class="author-chip" data-value="교은">교은</div>
                        </div>
                    </div>

                    <div class="input-group-premium">
                        <label>오늘의 이야기</label>
                        <textarea id="diary-content" class="content-input-premium" placeholder="오늘 어떤 일이 있었나요?"></textarea>
                    </div>

                    <div class="settings-group-premium">
                        <div class="setting-item-premium">
                            <span>비밀 일기로 잠글까요?</span>
                            <label class="ios-switch">
                                <input type="checkbox" id="is-private">
                                <span class="ios-slider"></span>
                            </label>
                        </div>
                        <div id="password-area" class="password-box-premium hidden">
                            <i class="fas fa-key"></i>
                            <input type="password" id="diary-password" placeholder="비밀번호 설정">
                        </div>
                    </div>
                    
                    <button id="save-diary-btn" class="main-action-btn-premium">일기 등록하기</button>
                </div>
            </div>
        </div>

        <!-- 일기 보기 모달 (가계부 표준) -->
        <div id="view-modal" class="modal hidden">
            <div class="modal-content">
                <header class="modal-header-premium">
                    <div style="display: flex; align-items: center; gap: 10px;">
                        <h3 class="modal-title-premium">일기 보기</h3>
                        <span id="view-author-badge" class="author-badge-premium"></span>
                    </div>
                    <button class="close-modal-btn" onclick="closeModal(document.getElementById('view-modal'))">
                        <i class="fas fa-times"></i>
                    </button>
                </header>
                
                <div class="modal-body-premium">
                    <div id="view-date" class="view-date-premium"></div>
                    <div id="view-body" class="view-content-premium"></div>
                    
                    <div class="view-footer-premium">
                        <button id="delete-diary-btn" class="delete-action-btn-premium">
                            <i class="fas fa-trash-can"></i>
                        </button>
                        <button class="main-action-btn-premium secondary" onclick="closeModal(document.getElementById('view-modal'))">닫기</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 비밀번호 확인 모달 -->
        <div id="auth-modal" class="modal hidden">
            <div class="auth-box">
                <i class="fas fa-lock auth-icon"></i>
                <p style="font-weight:700; margin-bottom:15px; color:white;">비밀 일기입니다</p>
                <input type="password" id="auth-password" class="auth-input" placeholder="****" maxlength="20">
                <div class="auth-btns">
                    <button class="cancel-auth" onclick="closeModal(document.getElementById('auth-modal'))">취소</button>
                    <button id="confirm-auth-btn" class="confirm-auth">확인</button>
                </div>
            </div>
        </div>

        <!-- 커스텀 컨펌 모달 -->
        <div id="confirm-modal" class="modal hidden">
            <div class="auth-box" style="margin-top:200px;">
                <i class="fas fa-question-circle auth-icon" style="color:var(--primary);"></i>
                <p id="confirm-msg" style="font-weight:700; margin-bottom:25px; color:white; line-height:1.5;"></p>
                <div class="auth-btns">
                    <button id="confirm-cancel-btn" class="cancel-auth">취소</button>
                    <button id="confirm-ok-btn" class="confirm-auth">확인</button>
                </div>
            </div>
        </div>
    </div>
    <script src="../config.js?v=1.5.1"></script>
    <script src="script.js?v=1.7.0"></script></script></script></script></script></script></script></script>
</body>

</html>
